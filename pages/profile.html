<!doctype html><html lang="en"><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080811"><title>Creator Profile | TITAN AI</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="/css/titan-features.css"></head><body><div class="titan-page"><header class="titan-head"><a class="titan-brand" href="/">♛ TITAN <b>AI</b><small>WATCH • CREATE • INSPIRE</small></a><a class="titan-back" href="/pages/settings.html">Settings</a></header><span class="eyebrow">YOUR CREATOR SPACE</span><h1 class="page-title">My Profile</h1><section class="glass"><div class="profile-hero"><img class="avatar" id="avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377f79?w=300" alt="Profile avatar"><div><h2 id="name">TITAN Creator</h2><p class="muted" id="handle">@creator</p><span class="eyebrow">✦ CREATOR</span></div></div><div class="stats" style="margin:20px 0"><div class="stat"><strong id="videoCount">0</strong><span>Videos</span></div><div class="stat"><strong id="followers">0</strong><span>Followers</span></div><div class="stat"><strong id="following">0</strong><span>Following</span></div></div><button class="btn primary" id="editBtn"><i class="fa-solid fa-pen"></i> Edit Profile</button></section><section class="glass" id="editPanel" hidden><h3>Edit your profile</h3><div class="field"><label>Display name</label><input id="editName" maxlength="40" placeholder="Your name"></div><div class="field"><label>Username</label><input id="editHandle" maxlength="30" placeholder="@username"></div><div class="field"><label>Profile image URL</label><input id="editAvatar" type="url" placeholder="https://..."></div><button class="btn gold" id="saveProfile">Save Profile</button></section><section class="glass"><h3>My Videos</h3><div class="video-list" id="myVideos"><p class="muted">No uploaded videos saved on this device yet. Use Upload to add a video draft.</p></div><a class="btn" href="/pages/creator.html" style="margin-top:14px">Upload a video</a></section></div><nav class="titan-bottom"><a href="/"><i class="fa-solid fa-house"></i>Home</a><a href="/pages/shorts.html"><i class="fa-solid fa-bolt"></i>Shorts</a><a href="/pages/creator.html"><i class="fa-solid fa-plus"></i>Upload</a><a href="/pages/studio.html"><i class="fa-solid fa-wand-magic-sparkles"></i>Studio</a><a class="active" href="/pages/profile.html"><i class="fa-solid fa-user"></i>Profile</a></nav><script>
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};let p=read("titan_user_profile",{name:"TITAN Creator",handle:"@creator",followers:0,following:0});function render(){document.getElementById("name").textContent=p.name||"TITAN Creator";document.getElementById("handle").textContent=p.handle||"@creator";document.getElementById("followers").textContent=p.followers||0;document.getElementById("following").textContent=p.following||0;if(p.avatar)document.getElementById("avatar").src=p.avatar;document.getElementById("editName").value=p.name||"";document.getElementById("editHandle").value=p.handle||"";document.getElementById("editAvatar").value=p.avatar||"";const vids=read("titan_user_uploads",[]);document.getElementById("videoCount").textContent=vids.length;const list=document.getElementById("myVideos");list.innerHTML=vids.length?"":'<p class="muted">No uploaded video drafts yet.</p>';vids.forEach(v=>{const row=document.createElement("div");row.className="video-row";row.innerHTML='<div style="min-width:0"><b></b><p class="muted"></p></div><button class="btn">Delete</button>';row.querySelector("b").textContent=v.title;row.querySelector("p").textContent=(v.type==="short"?"Short":"Long video")+" • Draft";row.querySelector("button").onclick=()=>{const next=read("titan_user_uploads",[]).filter(x=>x.id!==v.id);localStorage.setItem("titan_user_uploads",JSON.stringify(next));render()};list.append(row)})}document.getElementById("editBtn").onclick=()=>document.getElementById("editPanel").hidden=!document.getElementById("editPanel").hidden;document.getElementById("saveProfile").onclick=()=>{p={...p,name:document.getElementById("editName").value.trim()||"TITAN Creator",handle:(document.getElementById("editHandle").value.trim().replace(/^@/,"")||"creator").replace(/^/,"@"),avatar:document.getElementById("editAvatar").value.trim(),followers:p.followers||0,following:p.following||0};localStorage.setItem("titan_user_profile",JSON.stringify(p));render();alert("Profile saved on this device.")};render();
</script></body></html>
