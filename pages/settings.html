<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>Settings | TITAN AI</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/feature-pages.css"><link rel="stylesheet" href="/css/titan-midnight-aurora.css">
</head><body><div class="page-wrap"><header class="page-head"><a class="brand" href="/">♛ TITAN <b>AI</b><small>WATCH • CREATE • INSPIRE</small></a><a class="back" href="/">Home</a></header><main><span class="eyebrow">TITAN AI • SETTINGS</span><h1 class="title">Settings</h1><p class="sub">Manage your TITAN AI app preferences.</p><section class="panel"><div class="field"><label>Appearance</label><select id="settingTheme"><option value="dark">Dark — TITAN Premium</option><option value="system">System default</option></select></div><div class="field"><label>Language</label><select id="settingLanguage"><option>English</option><option>Urdu</option><option>Roman Urdu</option></select></div><div class="field"><label>Notifications</label><select id="settingNotifications"><option value="on">On</option><option value="off">Off</option></select></div><div class="field"><label>Privacy</label><select id="settingPrivacy"><option value="public">Public profile</option><option value="private">Private profile</option></select></div><a class="tile" href="#world"><i class="fa-solid fa-globe"></i><strong>World Updates</strong><span class="muted">News section planned for a later integration phase.</span></a><p id="settingsStatus" class="muted" style="margin-top:14px" aria-live="polite">Your preferences are saved on this device.</p></section></main></div><nav class="titan-unified-nav" aria-label="TITAN main navigation">

</nav><script>
(()=>{const key="titan_app_settings";const defaults={theme:"dark",language:"English",notifications:"on",privacy:"public"};let saved={};try{saved=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){}const values={...defaults,...saved};const fields={theme:"settingTheme",language:"settingLanguage",notifications:"settingNotifications",privacy:"settingPrivacy"};Object.entries(fields).forEach(([k,id])=>{const el=document.getElementById(id);el.value=values[k]??defaults[k];el.addEventListener("change",()=>{const next={};Object.entries(fields).forEach(([name,fieldId])=>next[name]=document.getElementById(fieldId).value);try{localStorage.setItem(key,JSON.stringify(next));document.getElementById("settingsStatus").textContent="Preferences saved on this device."}catch(e){document.getElementById("settingsStatus").textContent="Could not save preferences. Check device storage."}})});})();
</script><script src="/app-auth-system.js" defer></script></body></html>
