<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>Upload Center | TITAN AI</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/feature-pages.css"></head><body><div class="page-wrap"><header class="page-head"><a class="brand" href="/">♛ TITAN <b>AI</b><small>WATCH • CREATE • INSPIRE</small></a><a class="back" href="/">Home</a></header><main><span class="eyebrow">TITAN AI • UPLOAD CENTER</span><h1 class="title">Upload Center</h1><p class="sub">Select a Short or Long Video. This first screen validates your selection; permanent publishing requires the storage/database connection.</p><section class="panel"><div class="field"><label>Upload type</label><select id="type"><option value="short">Short Video (vertical)</option><option value="long">Long Video (landscape)</option></select></div><div class="field"><label>Video file</label><input id="file" type="file" accept="video/*"></div><div class="field"><label>Video title</label><input id="title" maxlength="100" placeholder="Add a clear title"></div><div class="field"><label>Description</label><textarea id="description" placeholder="Tell viewers about your video"></textarea></div><div class="field"><label>Category</label><select id="category"><option>Movies</option><option>Music</option><option>Gaming</option><option>Travel</option><option>News</option><option>AI Videos</option></select></div><button class="btn primary" id="validate">Check Video</button><div id="upload-status" class="status" hidden></div></section><script>document.getElementById('validate').onclick=()=>{const f=document.getElementById('file').files[0],s=document.getElementById('upload-status');s.hidden=false;if(!f){s.textContent='Choose a video first.';return}if(!f.type.startsWith('video/')){s.textContent='Please choose a video file.';return}if(f.size>100*1024*1024){s.textContent='File exceeds the current 100 MB upload limit.';return}s.textContent='File selected: '+f.name+' ('+(f.size/1048576).toFixed(1)+' MB). Permanent publishing is not connected yet.'};</script></main></div><nav class="bottom"><a href="/"><i class="fa-solid fa-house"></i>Home</a><a href="/pages/shorts.html"><i class="fa-solid fa-bolt"></i>Shorts</a><a href="/pages/creator.html"><i class="fa-solid fa-plus"></i>Upload</a><a href="/pages/studio.html"><i class="fa-solid fa-wand-magic-sparkles"></i>Studio</a><a href="/pages/profile.html"><i class="fa-solid fa-user"></i>Profile</a></nav><script src="/app-auth-system.js" defer></script></body></html>
