<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080811"><title>My Videos | TITAN AI"><link rel="stylesheet" href="/css/titan-features.css"><link rel="stylesheet" href="/css/titan-midnight-aurora.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>
body{min-height:100vh;background:#080811;color:#fff}.manage-wrap{max-width:900px;margin:0 auto;padding:24px 16px 110px}.manage-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.manage-head a{color:#fff;text-decoration:none}.manage-title{font-size:clamp(28px,6vw,42px);margin:28px 0 8px}.manage-sub{color:#aaa;line-height:1.6}.manage-note{padding:13px 15px;border:1px solid #8d72ca55;background:#8d72ca18;border-radius:14px;color:#ddd;margin:20px 0}.video-list{display:grid;gap:12px}.video-item{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;padding:13px;border:1px solid #ffffff18;background:#ffffff08;border-radius:16px}.video-thumb{width:110px;height:78px;border-radius:10px;background:#222;object-fit:cover}.video-meta h3{margin:0 0 7px;font-size:16px}.video-meta p{margin:0;color:#aaa;font-size:12px;line-height:1.5}.status-pill{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:20px;background:#8d72ca33;color:#d9c9ff;font-size:11px}.delete-btn{border:1px solid #ff777755;background:#ff44441a;color:#ffaaaa;padding:9px 11px;border-radius:10px}.empty-state{padding:30px;text-align:center;color:#bbb;border:1px dashed #ffffff35;border-radius:16px}.empty-state a{color:#d3baff}.muted{color:#aaa}@media(max-width:520px){.video-item{grid-template-columns:84px 1fr;}.video-thumb{width:84px;height:70px}.delete-btn{grid-column:2;justify-self:start}}
</style></head><body><main class="manage-wrap"><header class="manage-head"><a href="/">♛ TITAN <b style="color:#c29aff">AI</b></a><a href="/pages/creator.html">＋ Upload</a></header><h1 class="manage-title">My Videos</h1><p class="manage-sub">Manage your TITAN uploads. New uploads remain private drafts until a safe publishing and review workflow is available.</p><div class="manage-note"><i class="fa-solid fa-shield-halved"></i> Your drafts are visible only to your signed-in account. Deleting a draft removes its Firestore record; the Cloudinary media file may need separate cleanup.</div><p id="status" class="muted" aria-live="polite">Connecting…</p><section id="list" class="video-list"></section></main>
<script>
"use strict";
const firebaseConfig={apiKey:"AIzaSyB3OBHZ0XsaHO6Wld097gtvUK44JW2BBTQ",authDomain:"titan-ai-2ed23.firebaseapp.com",projectId:"titan-ai-2ed23",storageBucket:"titan-ai-2ed23.firebasestorage.app",messagingSenderId:"953003695391",appId:"1:953003695391:web:fd85e69723a0cdee96642a"};
const statusEl=document.getElementById("status"),list=document.getElementById("list");
function loadScript(src){return new Promise((resolve,reject)=>{if(document.querySelector('script[src="'+src+'"]'))return resolve();const s=document.createElement("script");s.src=src;s.async=true;s.onload=resolve;s.onerror=()=>reject(Error("Firebase SDK failed to load"));document.head.appendChild(s)})}
async function start(){await loadScript("https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js");await loadScript("https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js");await loadScript("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js");if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();auth.onAuthStateChanged(async user=>{if(!user){statusEl.textContent="Sign in on TITAN Home to view your private uploads.";list.innerHTML='<div class="empty-state"><a href="/">Return to Home and sign in</a></div>';return}await loadVideos(db,user)})}
async function loadVideos(db,user){statusEl.textContent="Loading your videos…";list.innerHTML="";try{const snap=await db.collection("videos").where("ownerUid","==",user.uid).get();const docs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const at=a.createdAt?.toMillis?a.createdAt.toMillis():0,bt=b.createdAt?.toMillis?b.createdAt.toMillis():0;return bt-at});if(!docs.length){statusEl.textContent="No uploads yet.";list.innerHTML='<div class="empty-state">Your video drafts will appear here.<br><br><a href="/pages/creator.html">Upload your first video</a></div>';return}statusEl.textContent=docs.length+" upload"+(docs.length===1?"":"s")+" found.";for(const v of docs){const row=document.createElement("article");row.className="video-item";const thumb=document.createElement("div");thumb.className="video-thumb";thumb.style.display="grid";thumb.style.placeItems="center";thumb.innerHTML='<i class="fa-solid fa-film"></i>';const meta=document.createElement("div");meta.className="video-meta";const title=document.createElement("h3");title.textContent=v.title||"Untitled video";const desc=document.createElement("p");desc.textContent=(v.type==="short"?"Short":"Long video")+" · "+(v.category||"Uncategorised");const pill=document.createElement("span");pill.className="status-pill";pill.textContent=v.status==="published"?"Published":"Private draft";meta.append(title,desc,pill);const del=document.createElement("button");del.className="delete-btn";del.type="button";del.innerHTML='<i class="fa-solid fa-trash"></i> Delete';del.addEventListener("click",async()=>{if(!confirm("Delete this video record from your TITAN account? The uploaded Cloudinary media may remain stored."))return;del.disabled=true;try{await db.collection("videos").doc(v.id).delete();row.remove();statusEl.textContent="Video record deleted.";if(!list.children.length)list.innerHTML='<div class="empty-state">No uploads yet. <a href="/pages/creator.html">Upload a video</a></div>'}catch(e){statusEl.textContent="Could not delete: "+(e.message||"Please try again.");del.disabled=false}});row.append(thumb,meta,del);list.append(row)}}catch(e){console.error(e);statusEl.textContent="Could not load videos: "+(e.message||"Check Firestore rules and connection.")}}
start().catch(e=>{console.error(e);statusEl.textContent="Firebase connection failed. Check configuration and reload."});
</script></body></html>
