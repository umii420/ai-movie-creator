const statusEl=document.getElementById("status"),grid=document.getElementById("videos");
function empty(message){const e=document.createElement("div");e.className="watch-empty";e.textContent=message;grid.replaceChildren(e)}
function loadScript(src){return new Promise((resolve,reject)=>{if(document.querySelector('script[src="'+src+'"]'))return resolve();const s=document.createElement("script");s.src=src;s.async=true;s.onload=resolve;s.onerror=()=>reject(Error("Firebase SDK failed to load"));document.head.appendChild(s)})}
