<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>AI Studio | TITAN AI</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/feature-pages.css"></head><body><div class="page-wrap"><header class="page-head"><a class="brand" href="/">♛ TITAN <b>AI</b><small>WATCH • CREATE • INSPIRE</small></a><a class="back" href="/">Home</a></header><main><span class="eyebrow">TITAN AI • AI STUDIO</span><h1 class="title">AI Studio</h1><p class="sub">Create scripts and organize cinematic projects with TITAN AI.</p><section class="panel"><div class="field"><label>Choose creation mode</label><select id="mode"><option value="script">Movie Script</option><option value="scene">Scene Breakdown</option><option value="image">Image Prompt</option></select></div><div class="field"><label>Your movie idea</label><textarea id="idea" placeholder="Describe your story, characters, setting and mood..."></textarea></div><div class="field"><label>Language</label><select id="lang"><option>Roman Urdu</option><option>English</option><option>Urdu</option></select></div><button class="btn primary" id="generate">Generate with TITAN AI</button><div id="result" class="status" hidden></div><p class="muted">Uses the existing /api/generate endpoint. Groq API contract is unchanged.</p></section><script>document.getElementById('generate').addEventListener('click',async()=>{const b=document.getElementById('generate'),out=document.getElementById('result'),prompt=document.getElementById('idea').value.trim();if(!prompt){alert('Please enter your movie idea first.');return}b.disabled=true;b.textContent='Generating...';out.hidden=false;out.textContent='TITAN AI is preparing your result...';try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,lang:document.getElementById('lang').value,category:document.getElementById('mode').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Generation failed');out.textContent=d.script||'No script was returned.';if(d.videoUrl){const a=document.createElement('a');a.href=d.videoUrl;a.target='_blank';a.rel='noopener';a.textContent='Open generated visual';a.style.display='block';a.style.marginTop='12px';out.append(a)}}catch(e){out.textContent='Error: '+e.message}finally{b.disabled=false;b.textContent='Generate with TITAN AI'}});</script></main></div><nav class="bottom"><a href="/"><i class="fa-solid fa-house"></i>Home</a><a href="/pages/shorts.html"><i class="fa-solid fa-bolt"></i>Shorts</a><a href="/pages/creator.html"><i class="fa-solid fa-plus"></i>Upload</a><a href="/pages/studio.html"><i class="fa-solid fa-wand-magic-sparkles"></i>Studio</a><a href="/pages/profile.html"><i class="fa-solid fa-user"></i>Profile</a></nav><script src="/app-auth-system.js" defer></script></body></html>
