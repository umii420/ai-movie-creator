const feed=document.getElementById("shortFeed"),progress=document.getElementById("progress");
function showMessage(message){const box=document.createElement("div");box.className="short-empty";box.textContent=message;feed.replaceChildren(box)}
function loadScript(src){return new Promise((resolve,reject)=>{if(document.querySelector('script[src="'+src+'"]'))return resolve();const s=document.createElement("script");s.src=src;s.async=true;s.onload=resolve;s.onerror=()=>reject(new Error("Firebase SDK failed to load"));document.head.appendChild(s)})}
function safeVideoUrl(value){try{const u=new URL(value);return u.protocol==="https:"&&u.hostname==="res.cloudinary.com"?u.href:null}catch(e){return null}}
function renderVideo(v,index){const card=document.createElement("article");card.className="short-card";const url=safeVideoUrl(v.videoUrl);if(!url)return null;const video=document.createElement("video");video.src=url;video.autoplay=index===0;video.muted=true;video.loop=true;video.playsInline=true;video.controls=true;video.preload=index===0?"auto":"metadata";video.setAttribute("aria-label",v.title||"TITAN Short video");const shade=document.createElement("div");shade.className="short-shade";const info=document.createElement("div");info.className="short-info";const creator=document.createElement("b");creator.textContent=v.creatorName||"TITAN Creator";const title=document.createElement("h2");title.textContent=v.title||"Untitled Short";const desc=document.createElement("p");desc.textContent=(v.description||"").slice(0,220);info.append(creator,title,desc);const actions=document.createElement("div");actions.className="short-actions";const share=document.createElement("button");share.className="round-action";share.type="button";share.setAttribute("aria-label","Share video");share.innerHTML='<i class="fa-solid fa-share"></i>';share.addEventListener("click",()=>{const data={title:v.title||"TITAN Short",url:location.origin+location.pathname+"#"+v.id};if(navigator.share)navigator.share(data).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(data.url).then(()=>alert("Video link copied."))});const shareLabel=document.createElement("small");shareLabel.textContent="Share";const shareWrap=document.createElement("div");shareWrap.append(share,shareLabel);actions.append(shareWrap);card.append(video,shade,info,actions);return card}
