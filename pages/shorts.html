<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080811"><title>TITAN Shorts | TITAN AI</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="/css/titan-features.css"></head><body><div class="titan-page"><header class="titan-head"><a class="titan-brand" href="/">♛ TITAN <b>AI</b><small>WATCH • CREATE • INSPIRE</small></a><a class="titan-back" href="/">Home</a></header><span class="eyebrow">VERTICAL VIDEO • DISCOVER</span><h1 class="page-title">TITAN Shorts</h1><p class="page-sub">Discover quick stories from the TITAN creator community.</p><div class="short-feed" id="shortFeed"></div></div><nav class="titan-bottom"><a href="/"><i class="fa-solid fa-house"></i>Home</a><a class="active" href="/pages/shorts.html"><i class="fa-solid fa-bolt"></i>Shorts</a><a href="/pages/creator.html"><i class="fa-solid fa-plus"></i>Upload</a><a href="/pages/studio.html"><i class="fa-solid fa-wand-magic-sparkles"></i>Studio</a><a href="/pages/profile.html"><i class="fa-solid fa-user"></i>Profile</a></nav><script>
const demo=[
{title:"The Dragon World | Zayn & Luna",creator:"TITAN Originals",tag:"#Zayn #Luna #Fantasy",img:"https://cdn.pixabay.com/photo/2017/08/30/13/07/fantasy-2697018_1280.jpg",likes:235000},
{title:"Fantasy Creator Story",creator:"TITAN Creators",tag:"#Fantasy #Creator",img:"https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900",likes:128000},
{title:"Racing Dreams",creator:"TITAN Motors",tag:"#Racing #Cars",img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=900",likes:86000},
{title:"Teri Yaadein | Music",creator:"TITAN Music",tag:"#Music #Original",img:"https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=900",likes:42000}
]
const feed=document.getElementById("shortFeed");demo.forEach((v,i)=>{const liked=localStorage.getItem("titan_short_like_"+i)==="1";const card=document.createElement("article");card.className="short-card";card.innerHTML='<img src="'+v.img+'" alt=""><div class="short-shade"></div><div class="short-info"><b>'+v.creator+'</b><h2>'+v.title+'</h2><p class="muted">'+v.tag+'</p><a class="btn" href="/pages/creator.html">Create a Short</a></div><div class="short-actions"><div><button class="round-action '+(liked?'liked':'')+'" aria-label="Like"><i class="fa-solid fa-heart"></i></button><small class="likes">'+(v.likes/1000).toFixed(0)+'K</small></div><div><button class="round-action comment" aria-label="Comment"><i class="fa-solid fa-comment"></i></button><small>Comment</small></div><div><button class="round-action share" aria-label="Share"><i class="fa-solid fa-share"></i></button><small>Share</small></div></div>';const like=card.querySelector(".round-action");like.onclick=()=>{const on=like.classList.toggle("liked");localStorage.setItem("titan_short_like_"+i,on?"1":"0")};card.querySelector(".comment").onclick=()=>{const c=prompt("Write a comment");if(c)alert("Comment saved on this device for this demo.")};card.querySelector(".share").onclick=()=>navigator.share?navigator.share({title:v.title,url:location.href}):alert(location.href);feed.append(card)});
</script></body></html>
