<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080811"><title>TITAN Shorts | TITAN AI</title><link rel="preconnect" href="https://images.unsplash.com"><link rel="preconnect" href="https://cdn.pixabay.com"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="/css/titan-features.css"><style>
html,body{height:100%;height:100dvh;margin:0;overflow:hidden;background:#050509}.shorts-shell{height:100%;height:100dvh;position:relative;background:#050509}.short-feed{height:100%;height:100dvh;overflow-y:auto;overscroll-behavior-y:contain;scroll-snap-type:y mandatory;scrollbar-width:none;display:block}.short-feed::-webkit-scrollbar{display:none}.short-card{height:100%;height:100dvh;min-height:100%;width:100%;max-width:720px;margin:0 auto;border:0;border-radius:0;position:relative;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always;background:#111;display:block}.short-card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.short-shade{position:absolute;inset:0;background:linear-gradient(180deg,#0007 0%,transparent 22%,transparent 48%,#000b 100%)}.short-top{position:absolute;z-index:4;top:calc(12px + env(safe-area-inset-top));left:16px;right:16px;display:flex;align-items:center;justify-content:space-between}.short-brand{font-weight:900;letter-spacing:.5px;text-decoration:none;text-shadow:0 2px 10px #000}.short-brand b{color:#c29aff}.short-top a{color:#fff;text-decoration:none;font-size:13px;background:#0005;padding:9px 12px;border-radius:20px;backdrop-filter:blur(12px)}.short-info{position:absolute;z-index:2;left:18px;right:82px;bottom:calc(88px + env(safe-area-inset-bottom));padding:0;width:auto}.short-info h2{font-size:22px;margin:8px 0}.short-info p{margin:6px 0 12px}.short-info .btn{background:#ffffff20;border-color:#ffffff70;backdrop-filter:blur(10px)}.short-actions{position:absolute;right:14px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:3;gap:18px}.round-action{width:48px;height:48px;background:#1118;backdrop-filter:blur(10px)}.short-actions small{color:#fff;text-shadow:0 1px 4px #000}.shorts-progress{position:absolute;z-index:5;top:0;left:0;right:0;height:3px;background:#ffffff30}.shorts-progress span{display:block;height:100%;width:25%;background:#c29aff}.titan-bottom{z-index:10;padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:#080811ed}.titan-bottom a{font-size:9px}.short-empty{padding:30px;color:white}@media(min-width:721px){.short-card{border-left:1px solid #ffffff20;border-right:1px solid #ffffff20}.short-feed{background:#080811}}
</style><link rel="stylesheet" href="/css/titan-midnight-aurora.css">
</head><body><main class="shorts-shell"><div class="shorts-progress"><span id="progress"></span></div><div class="short-top"><a class="short-brand" href="/">♛ TITAN <b>AI</b></a><a href="/"> <i class="fa-solid fa-house"></i> Home</a></div><div class="short-feed" id="shortFeed" aria-label="Vertical Shorts feed"></div></main><nav class="titan-bottom"><a href="/"><i class="fa-solid fa-house"></i>Home</a><a class="active" href="/pages/shorts.html"><i class="fa-solid fa-bolt"></i>Shorts</a><a href="/pages/creator.html"><i class="fa-solid fa-plus"></i>Upload</a><a href="/pages/studio.html"><i class="fa-solid fa-wand-magic-sparkles"></i>Studio</a><a href="/pages/profile.html"><i class="fa-solid fa-user"></i>Profile</a></nav>
<script>
const demo=[
{title:"The Dragon World | Zayn & Luna",creator:"TITAN Originals",tag:"#Zayn #Luna #Fantasy",img:"https://cdn.pixabay.com/photo/2017/08/30/13/07/fantasy-2697018_1280.jpg",likes:235000},
{title:"Fantasy Creator Story",creator:"TITAN Creators",tag:"#Fantasy #Creator",img:"https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900&auto=format&fit=crop&q=75",likes:128000},
{title:"Racing Dreams",creator:"TITAN Motors",tag:"#Racing #Cars",img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=900&auto=format&fit=crop&q=75",likes:86000},
{title:"Teri Yaadein | Music",creator:"TITAN Music",tag:"#Music #Original",img:"https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=900&auto=format&fit=crop&q=75",likes:42000}
];
const feed=document.getElementById("shortFeed");
demo.forEach((v,i)=>{const card=document.createElement("article");card.className="short-card";const liked=localStorage.getItem("titan_short_like_"+i)==="1";card.innerHTML='<img loading="'+(i===0?'eager':'lazy')+'" src="'+v.img+'" alt="'+v.title+'"><div class="short-shade"></div><div class="short-info"><b>'+v.creator+'</b><h2>'+v.title+'</h2><p>'+v.tag+'</p><a class="btn" href="/pages/creator.html?type=short"><i class="fa-solid fa-plus"></i> Create a Short</a></div><div class="short-actions"><div><button class="round-action like '+(liked?'liked':'')+'" aria-label="Like"><i class="fa-solid fa-heart"></i></button><small class="likes">'+(v.likes/1000).toFixed(0)+'K</small></div><div><button class="round-action comment" aria-label="Comment"><i class="fa-solid fa-comment"></i></button><small>Comment</small></div><div><button class="round-action share" aria-label="Share"><i class="fa-solid fa-share"></i></button><small>Share</small></div></div>';const like=card.querySelector(".like");like.onclick=()=>{const on=like.classList.toggle("liked");localStorage.setItem("titan_short_like_"+i,on?"1":"0")};card.querySelector(".comment").onclick=()=>{const c=prompt("Write a comment");if(c)alert("Comment saved on this device for this demo.")};card.querySelector(".share").onclick=()=>navigator.share?navigator.share({title:v.title,url:location.href}):alert(location.href);feed.append(card)});
const progress=document.getElementById("progress");feed.addEventListener("scroll",()=>{const index=Math.round(feed.scrollTop/feed.clientHeight);progress.style.width=((index+1)/demo.length*100)+"%"},{passive:true});
</script></body></html>
