<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Movie Creator - Mythic Cinematic Engine</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-black: #050507;
            --card-bg: #0d0e12;
            --accent-green: #00ff87;
            --accent-purple: #7928ca;
            --accent-cyan: #00dfd8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-glow: rgba(255, 255, 255, 0.1);
            --header-bg: rgba(5, 5, 7, 0.9);
            --store-bg: #12141c;
            --store-text: #ffffff;
            --font-heading: 'Space Grotesk', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --font-gemini: 'Inter', sans-serif;
        }

        body.light-mode {
            --bg-black: #f4f5f8;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #4b5563;
            --border-glow: rgba(0, 0, 0, 0.12);
            --header-bg: rgba(244, 245, 248, 0.92);
            --store-bg: #111827;
            --store-text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-body);
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-glow);
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .icon-btn:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .main-container {
            max-width: 900px;
            margin: 110px auto 40px auto;
            padding: 0 20px;
        }

        .hero-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-title h2 {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .hero-title p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .creator-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 140px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 16px;
            color: var(--text-main);
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            border: none;
            border-radius: 14px;
            color: #000;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0, 255, 135, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(0, 255, 135, 0.4);
        }

        /* Drawer / Modal Settings */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            z-index: 101;
        }

        .drawer-overlay.active {
            display: block;
        }

        .drawer {
            position: fixed;
            right: -360px;
            top: 0;
            width: 340px;
            height: 100%;
            background: var(--card-bg);
            border-left: 1px solid var(--border-glow);
            padding: 30px 20px;
            z-index: 102;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        .drawer.active {
            right: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-glow);
        }

        .setting-item {
            margin-bottom: 20px;
        }

        .setting-item label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            border-radius: 10px;
            outline: none;
        }

        select option {
            background: var(--card-bg);
            color: var(--text-main);
        }

        /* Result Output Modal */
        .result-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 90%;
            max-width: 750px;
            max-height: 85vh;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 25px;
            z-index: 200;
            display: none;
            flex-direction: column;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .result-modal.active {
            display: flex;
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .script-body {
            overflow-y: auto;
            margin-top: 15px;
            white-space: pre-wrap;
            line-height: 1.7;
            background: rgba(0, 0, 0, 0.2);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--border-glow);
            font-size: 0.95rem;
        }

        .btn-copy {
            align-self: flex-end;
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
        }

        /* WhatsApp Modal */
        .wa-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            padding: 30px;
            border-radius: 20px;
            z-index: 300;
            display: none;
            text-align: center;
        }

        .wa-modal.active {
            display: block;
        }

        .wa-btn {
            background: #25D366;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-clapperboard"></i> AI Movie Creator
        </div>
        <div class="nav-actions">
            <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
            <button class="icon-btn" onclick="openWhatsApp()" title="Developer Support"><i class="fa-brands fa-whatsapp"></i></button>
            <button class="icon-btn" onclick="toggleDrawer()" title="VIP Settings"><i class="fa-solid fa-sliders"></i></button>
        </div>
    </header>

    <div class="main-container">
        <div class="hero-title">
            <h2>Transform Ideas Into Films</h2>
            <p>Generate professional cinematic scripts, scene prompts, and directions instantly.</p>
        </div>

        <div class="creator-card">
            <div class="input-group">
                <label for="userPromptInput"><i class="fa-solid fa-wand-magic-sparkles"></i> Describe Your Movie Idea or Scene Concept:</label>
                <textarea id="userPromptInput" placeholder="E.g., A high-stakes futuristic thriller set in rainy Tokyo, featuring a lone agent uncovering a cyber conspiracy..."></textarea>
            </div>

            <button class="btn-submit" onclick="generateScript()">
                <i class="fa-solid fa-film"></i> Generate Cinematic Script
            </button>
        </div>
    </div>

    <!-- VIP Drawer Settings -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="settingsDrawer">
        <div class="drawer-header">
            <h3><i class="fa-solid fa-gear"></i> VIP Settings</h3>
            <button class="icon-btn" onclick="toggleDrawer()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="setting-item">
            <label>Script Language</label>
            <select id="settingLang" onchange="saveSettings()">
                <option value="Roman Urdu">Roman Urdu</option>
                <option value="Urdu">Urdu</option>
                <option value="English">English</option>
                <option value="Hindi">Hindi</option>
            </select>
        </div>

        <div class="setting-item">
            <label>Aspect Ratio Format</label>
            <select id="settingRatio" onchange="saveSettings()">
                <option value="16:9 Cinematic">16:9 Cinematic (YouTube / Movie)</option>
                <option value="9:16 Vertical">9:16 Vertical (TikTok / Shorts)</option>
                <option value="1:1 Square">1:1 Square (Instagram)</option>
            </select>
        </div>

        <div class="setting-item">
            <label>Director Style</label>
            <select id="settingStyle" onchange="saveSettings()">
                <option value="Hollywood Blockbuster">Hollywood Blockbuster</option>
                <option value="Christopher Nolan Dark Sci-Fi">Christopher Nolan Sci-Fi</option>
                <option value="Bollywood Drama Action">Bollywood Drama Action</option>
                <option value="Anime Aesthetic">Anime Aesthetic</option>
            </select>
        </div>

        <div class="setting-item">
            <label>Script Length</label>
            <select id="settingLength" onchange="saveSettings()">
                <option value="Detailed Multi-Scene Story">Detailed Multi-Scene Story</option>
                <option value="Short Teaser / Trailer Script">Short Teaser / Trailer Script</option>
            </select>
        </div>
    </div>

    <!-- Result Output Modal -->
    <div class="drawer-overlay" id="modalOverlay" onclick="closeModal()"></div>
    <div class="result-modal" id="geminiOutputModal">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3><i class="fa-solid fa-scroll"></i> Generated Cinematic Script</h3>
            <button class="icon-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <p style="margin-top: 8px; font-size: 0.85rem; color: var(--text-muted);" id="displayUserPrompt"></p>
        <div class="script-body" id="scriptResultContent">
            <!-- Output script will be injected here -->
        </div>
    </div>

    <!-- WhatsApp Support Modal -->
    <div class="wa-modal" id="waModal">
        <h3><i class="fa-brands fa-whatsapp" style="color: #25D366;"></i> Developer Support</h3>
        <p style="margin-top: 10px; color: var(--text-muted); font-size: 0.9rem;">Need help or custom integrations for AI Movie Creator?</p>
        <a href="https://wa.me/923000000000" target="_blank" class="wa-btn"><i class="fa-brands fa-whatsapp"></i> Chat on WhatsApp</a>
        <br>
        <button class="icon-btn" style="margin: 15px auto 0 auto;" onclick="closeWhatsApp()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <script>
        // Load Settings on Start
        window.onload = function() {
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeIcon').classList.replace('fa-moon', 'fa-sun');
            }
            if (localStorage.getItem('script_lang')) document.getElementById('settingLang').value = localStorage.getItem('script_lang');
            if (localStorage.getItem('aspect_ratio')) document.getElementById('settingRatio').value = localStorage.getItem('aspect_ratio');
            if (localStorage.getItem('director_style')) document.getElementById('settingStyle').value = localStorage.getItem('director_style');
            if (localStorage.getItem('script_length')) document.getElementById('settingLength').value = localStorage.getItem('script_length');
        };

        function toggleTheme() {
            if (document.body.classList.contains('light-mode')) {
                document.body.classList.remove('light-mode');
                localStorage.setItem('theme', 'dark');
                document.getElementById('themeIcon').classList.replace('fa-sun', 'fa-moon');
            } else {
                document.body.classList.add('light-mode');
                localStorage.setItem('theme', 'light');
                document.getElementById('themeIcon').classList.replace('fa-moon', 'fa-sun');
            }
        }

        function toggleDrawer() {
            document.getElementById('settingsDrawer').classList.toggle('active');
            document.getElementById('drawerOverlay').classList.toggle('active');
        }

        function saveSettings() {
            localStorage.setItem('script_lang', document.getElementById('settingLang').value);
            localStorage.setItem('aspect_ratio', document.getElementById('settingRatio').value);
            localStorage.setItem('director_style', document.getElementById('settingStyle').value);
            localStorage.setItem('script_length', document.getElementById('settingLength').value);
        }

        function openWhatsApp() {
            document.getElementById('waModal').classList.add('active');
            document.getElementById('drawerOverlay').classList.add('active');
        }

        function closeWhatsApp() {
            document.getElementById('waModal').classList.remove('active');
            document.getElementById('drawerOverlay').classList.remove('active');
        }

        function closeModal() {
            document.getElementById('geminiOutputModal').classList.remove('active');
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function copyScriptText() {
            const content = document.getElementById('scriptResultContent').innerText.replace("Copy Script", "").trim();
            navigator.clipboard.writeText(content);
            alert("Script copied to clipboard!");
        }

        // Secure Serverless Backend Call
        async function generateScript() {
            let inputVal = document.getElementById('userPromptInput').value;
            if (inputVal.trim() === "") {
                alert("Please enter a video prompt first!");
                return;
            }

            const chosenLang = localStorage.getItem('script_lang') || 'Roman Urdu';
            const chosenRatio = localStorage.getItem('aspect_ratio') || '16:9 Cinematic';
            const chosenStyle = localStorage.getItem('director_style') || 'Hollywood Blockbuster';
            const chosenLength = localStorage.getItem('script_length') || 'Detailed Multi-Scene Story';

            document.getElementById('displayUserPrompt').innerText = '"' + inputVal + '"';
            document.getElementById('scriptResultContent').innerHTML = `<button class="btn-copy" onclick="copyScriptText()"><i class="fa-solid fa-copy"></i> Copy Script</button>⏳ Groq AI is generating your ${chosenStyle} script in ${chosenLang}...`;
            
            document.getElementById('geminiOutputModal').classList.add('active');
            document.getElementById('modalOverlay').classList.add('active');

            try {
                const response = await fetch("/api/generate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        prompt: inputVal,
                        style: chosenStyle,
                        ratio: chosenRatio,
                        length: chosenLength,
                        lang: chosenLang
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `Server error: ${response.status}`);
                }

                if (data.script && data.script.trim() !== "") {
                    document.getElementById('scriptResultContent').innerHTML = `<button class="btn-copy" onclick="copyScriptText()"><i class="fa-solid fa-copy"></i> Copy Script</button>` + data.script;
                } else {
                    document.getElementById('scriptResultContent').innerHTML = `<button class="btn-copy" onclick="copyScriptText()"><i class="fa-solid fa-copy"></i> Copy Script</button>❌ Received empty response from server.`;
                }
            } catch (error) {
                document.getElementById('scriptResultContent').innerHTML = `<button class="btn-copy" onclick="copyScriptText()"><i class="fa-solid fa-copy"></i> Copy Script</button>❌ Connection Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
