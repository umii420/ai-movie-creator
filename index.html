<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Movie Creator - Titan AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0b0f17;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 5%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            text-align: center;
        }

        .hero-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .hero-subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .workspace-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            margin-bottom: 15px;
        }

        .generate-btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">🎬 TITAN AI MOVIE CREATOR</div>
        <div id="titanLoginContainer"></div>
    </header>

    <div class="container">
        <h1 class="hero-title">Turn Your Ideas into AI Movies</h1>
        <p class="hero-subtitle">Create original scenes, fantasy worlds, and voiceovers instantly.</p>

        <div class="workspace-card">
            <textarea placeholder="Describe your movie scene or story prompt here..."></textarea>
            <button class="generate-btn">Generate AI Movie Scene 🚀</button>
        </div>
    </div>

    <!-- Script Import -->
    <script src="./app-auth-system.js"></script>

</body>
</html>
