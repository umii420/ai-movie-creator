<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TITAN AI — Official Platform</title>
    <meta name="theme-color" content="#050507">
    <meta name="description" content="TITAN AI — Create AI movies, write scripts, and share your creativity.">

    <!-- Font Awesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Space+Grotesk:wght@500;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-black: #050507;
            --card-bg: #0d0e12;
            --accent-gold: #f59e0b;
            --accent-gold-light: #fbbf24;
            --verified-blue: #00b2ff;
            --text-main: #f8fafc;
            --text-muted: #9ca3af;
            --border-glow: rgba(245, 158, 11, 0.25);
            --border-soft: rgba(255, 255, 255, 0.08);

            --font-heading: 'Space Grotesk', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --font-gemini: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-body);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-black) !important;
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Light mode force disable for pure dark theme */
        body.light-mode {
            background-color: var(--bg-black) !important;
            color: var(--text-main);
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* Main app feed container */
        .features-section {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 10px;
        }

        /* AI Studio result modal */
        .gemini-modal-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: var(--bg-black);
            z-index: 20000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            padding: 20px 5%;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .gemini-modal-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .gemini-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-glow);
            margin-bottom: 15px;
        }

        .gemini-content-box {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            font-family: var(--font-gemini);
            padding-bottom: 120px;
        }

        .gemini-prompt-display {
            overflow-wrap: anywhere;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        .gemini-response-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 25px 30px;
            line-height: 1.7;
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow-wrap: anywhere;
        }

        .gemini-response-card h1,
        .gemini-response-card h2,
        .gemini-response-card h3 {
            font-family: var(--font-heading);
            margin: 20px 0 10px;
        }

        .gemini-response-card p {
            margin: 10px 0;
        }

        .gemini-response-card ul,
        .gemini-response-card ol {
            padding-left: 24px;
            margin: 12px 0;
        }

        .gemini-response-card pre {
            overflow-x: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .gemini-response-card img {
            max-width: 100%;
            height: auto;
        }

        .modal-prompt-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px 5%;
            background: rgba(5, 5, 7, 0.96);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-glow);
            z-index: 25000;
            display: flex;
            justify-content: center;
        }

        .modal-prompt-box {
            width: 100%;
            max-width: 800px;
            background: linear-gradient(
                180deg,
                rgba(30, 32, 40, 0.95),
                rgba(15, 16, 22, 0.98)
            );
            border-radius: 18px;
            padding: 12px 16px;
            border: 1px solid var(--border-glow);
        }

        .modal-prompt-input-row {
            background: #ffffff;
            border-radius: 12px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-prompt-input-row textarea {
            flex-grow: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.9rem;
            color: #111111;
            resize: vertical;
            min-height: 38px;
            max-height: 120px;
        }

        .btn-arrow-luma {
            flex-shrink: 0;
            background: #000000;
            color: var(--accent-gold);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .btn-arrow-luma:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .btn-contact {
            background: transparent;
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .btn-contact:hover {
            border-color: var(--accent-gold);
        }

        /* Google Login Gate */
        #titanAuthGateOverlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: rgba(5, 5, 7, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        .titan-gate-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            padding: 40px 28px;
            border-radius: 28px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .titan-gate-icon {
            width: 70px;
            height: 70px;
            background: rgba(245, 158, 11, 0.15);
            border: 2px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--accent-gold);
            font-size: 2rem;
        }

        .titan-gate-card h2 {
            color: var(--text-main);
            font-family: var(--font-heading);
            font-size: 1.7rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .titan-gate-card p {
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .btn-google-gate {
            background: #ffffff;
            color: #000000;
            width: 100%;
            padding: 15px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.98rem;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-google-gate:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(255, 255, 255, 0.2);
        }

        .btn-google-gate:focus-visible,
        .btn-contact:focus-visible,
        .btn-arrow-luma:focus-visible {
            outline: 2px solid var(--accent-gold);
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            .gemini-modal-overlay {
                padding: 14px 12px;
            }

            .gemini-response-card {
                padding: 18px 16px;
                font-size: 0.95rem;
            }

            .gemini-content-box {
                padding-bottom: 140px;
            }

            .modal-prompt-container {
                padding: 10px 12px;
            }

            .modal-prompt-box {
                padding: 10px;
            }

            .titan-gate-card {
                padding: 32px 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- Google Login Gate -->
    <div id="titanAuthGateOverlay" style="display: none;">
        <div class="titan-gate-card">

            <div class="titan-gate-icon">
                <i class="fa-solid fa-clapperboard"></i>
            </div>

            <h2>Welcome to TITAN AI</h2>

            <p>
                Sign in with your Google account to create AI movies,
                save your progress, and build your creator profile.
            </p>

            <button
                type="button"
                onclick="handleGoogleLogin()"
                class="btn-google-gate"
            >
                <i
                    class="fa-brands fa-google"
                    style="color: #ea4335; font-size: 1.25rem;"
                ></i>

                Continue with Google
            </button>

        </div>
    </div>

    <!-- Main App Feed -->
    <div class="features-section"></div>

    <!-- TITAN AI Script Result Modal -->
    <div
        class="gemini-modal-overlay"
        id="geminiOutputModal"
        role="dialog"
        aria-modal="true"
        aria-label="TITAN AI Studio"
    >

        <div class="gemini-header">

            <div style="font-weight: 800; font-size: 1.1rem;">
                TITAN
                <span style="color: #f59e0b;">AI</span>
                STUDIO
            </div>

            <button
                type="button"
                class="btn-contact"
                onclick="closeGeminiModal()"
            >
                <i class="fa-solid fa-xmark"></i>
                Close
            </button>

        </div>

        <div class="gemini-content-box">

            <div
                class="gemini-prompt-display"
                id="displayUserPrompt"
            >
                Your prompt will appear here.
            </div>

            <div
                class="gemini-response-card"
                id="scriptResultContent"
                aria-live="polite"
            >
                Enter a prompt to generate your script.
            </div>

        </div>

        <div class="modal-prompt-container">

            <div class="modal-prompt-box">

                <div
                    style="font-size: 0.85rem; color: #fff; margin-bottom: 6px; font-weight: 600;"
                >
                    Chat with TITAN AI Director Engine
                </div>

                <div class="modal-prompt-input-row">

                    <textarea
                        id="modalPromptInput"
                        placeholder="Write your script or prompt..."
                        aria-label="Enter your script prompt"
                    ></textarea>

                    <button
                        type="button"
                        class="btn-arrow-luma"
                        id="modalSubmitBtn"
                        onclick="generateScript('modalPromptInput')"
                        aria-label="Generate script"
                    >
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!--
        Fake Blue Tick and Monetization Modal Removed.

        Compatibility functions are retained below so that older
        JavaScript files calling openAccountModal() do not crash.

        These functions do not verify accounts or activate payments.
    -->

    <script>
        /* -------------------------------------------------------
           LEGACY ACCOUNT BUTTON COMPATIBILITY
           No fake verification or monetization activation.
        ------------------------------------------------------- */

        window.openAccountModal = function () {
            if (typeof window.openTitanProfile === "function") {
                window.openTitanProfile();
                return;
            }

            if (typeof window.openProfilePage === "function") {
                window.openProfilePage();
                return;
            }

            console.info("TITAN AI: Profile is not available yet.");
        };

        window.closeAccountModal = function () {
            /* The old fake account modal has been removed. */
        };

        window.registerUserAccount = function () {
            alert(
                "TITAN AI: Account verification and monetization " +
                "are not available through this button."
            );
        };


        /* -------------------------------------------------------
           TITAN AI STUDIO
           Existing /api/generate endpoint and Groq model retained.
        ------------------------------------------------------- */

        window.openTitanStudioGemini = function () {
            const modal = document.getElementById("geminiOutputModal");

            if (!modal) return;

            modal.classList.add("active");

            const promptInput = document.getElementById("modalPromptInput");

            if (promptInput) {
                setTimeout(function () {
                    promptInput.focus();
                }, 100);
            }
        };


        window.closeGeminiModal = function () {
            const modal = document.getElementById("geminiOutputModal");

            if (modal) {
                modal.classList.remove("active");
            }
        };


        /* -------------------------------------------------------
           SCRIPT GENERATOR
           API endpoint, model, language and request structure kept.
        ------------------------------------------------------- */

        window.generateScript = async function (inputId) {
            const inputField = document.getElementById(inputId);

            if (!inputField) {
                console.error("TITAN AI: Prompt input not found:", inputId);
                return;
            }

            const inputVal = inputField.value.trim();

            if (!inputVal) {
                alert("Please enter a message or prompt first!");
                inputField.focus();
                return;
            }

            const submitBtn = document.getElementById("modalSubmitBtn");
            const promptDisplay = document.getElementById("displayUserPrompt");
            const resultCard = document.getElementById("scriptResultContent");
            const modal = document.getElementById("geminiOutputModal");

            if (!submitBtn || !promptDisplay || !resultCard || !modal) {
                console.error("TITAN AI: Script generator elements are missing.");
                alert("The Studio interface could not be loaded. Please reload the page.");
                return;
            }

            if (submitBtn.disabled) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            promptDisplay.textContent = '"' + inputVal + '"';
            resultCard.textContent = "Generating your script...";
            modal.classList.add("active");

            try {
                const response = await fetch("/api/generate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        prompt: inputVal,
                        style: "Hollywood Blockbuster",
                        ratio: "16:9 Cinematic",
                        length: "Detailed Multi-Scene Story",
                        lang: "Roman Urdu",
                        model: "llama-3.3-70b-versatile"
                    })
                });

                let data;

                try {
                    data = await response.json();
                } catch (parseError) {
                    throw new Error(
                        "The server returned an invalid response. Please try again."
                    );
                }

                if (!response.ok) {
                    throw new Error(
                        data.error || "Server error: " + response.status
                    );
                }

                if (data.script && data.script.trim() !== "") {
                    const scriptText = data.script;

                    inputField.value = "";

                    resultCard.textContent = scriptText;

                    if (
                        window.marked &&
                        typeof window.marked.parse === "function"
                    ) {
                        resultCard.innerHTML = window.marked.parse(scriptText);
                    }

                } else {
                    resultCard.textContent =
                        "The server returned an empty response. Please try again.";
                }

            } catch (error) {
                console.error("TITAN AI script generation error:", error);

                resultCard.textContent =
                    "Connection Error: " +
                    (error.message || "Unable to generate the script.") +
                    "\n\nPlease check your internet connection and try again.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-arrow-up"></i>';
            }
        };
    </script>

    <!-- Load other systems -->
    <script src="app-auth-system.js"></script>
    <script src="app-profile-system.js"></script>
    <script src="app-upload-system.js"></script>
    <script src="app-extensions-v2.js"></script>
<script src="app-shorts-player.js"></script>
    <script src="app-long-video-player.js"></script>
</body>
</html>
